# Add inside the existing `server { server_name tanvas.cn; ... }` block (HTTPS).
# /api/oauth/* is already covered by the existing /api/ location (Tanva backend).

# Remote MCP endpoint (Streamable HTTP). No buffering so streamed responses flush.
location = /mcp {
    proxy_pass http://127.0.0.1:3920;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 4m;
}
location ^~ /mcp/ {
    proxy_pass http://127.0.0.1:3920;
    proxy_set_header Host $host;
}

# OAuth discovery (RFC 9728 protected resource + RFC 8414 authorization server).
# Must live at the domain root; must be matched before the SPA fallback.
location ^~ /.well-known/oauth- {
    proxy_pass http://127.0.0.1:3920;
    proxy_set_header Host $host;
}
