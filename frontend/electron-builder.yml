appId: com.tanva.desktop
productName: Tanva
electronVersion: 43.4.1
asar: true
npmRebuild: false
directories:
  output: ../release
files:
  - main.mjs
  - app-lifecycle.mjs
  - preload.cjs
  - capability-host.mjs
  - desktop-runtime.mjs
  - mcp-config-normalizer.mjs
  - desktop-mcp-templates.mjs
  - construction-model.mjs
  - procurement-model.mjs
  - construction-host.mjs
  - compute-use.mjs
  - compute-use-actions.mjs
  - local-codex-client.mjs
  - package.json
extraResources:
  - from: ../dist
    to: renderer
    filter:
      - "**/*"
  - from: ../desktop-bundle
    to: desktop-bundle
    filter:
      - "**/*"
extraMetadata:
  main: main.mjs
mac:
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
  icon: ../public/logo.png
win:
  target:
    - nsis
  icon: ../public/logo.png
linux:
  category: Graphics
  target:
    - AppImage
  icon: ../public/logo.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
